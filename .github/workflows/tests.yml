name: Tests

# Une PR mergee sur signal rouge a coute deux pannes de production cette
# semaine (28 septembre: build frontend en erreur, puis 502 pendant 11 h sur
# des migrations en conflit). Ce job rend le signal visible AVANT le merge.
# Pour qu'il BLOQUE le merge, le cocher dans Settings, Branches, protection
# de main, « Require status checks to pass ».

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  runtime-postgres:
    name: Runtime durable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planner_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: planner_refonte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner_test -d planner_refonte"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://planner_test:local-ci-only@127.0.0.1:5432/planner_refonte
      DEBUG: "True"
      SECRET_KEY: ci-not-a-secret
      JEV_API_KEY: ""
      TYPESAFE_API_KEY: ""
      JUGEMENT_REPLI_LLM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - name: Transactions, autorisations, API et concurrence
        run: python manage.py test core.test_planning_constraints core.test_runtime_review core.test_agent_runtime_persistence core.test_agent_runtime_tools core.test_agent_runtime_loop core.test_agent_runtime_api core.test_agent_runtime_concurrency --noinput
      - name: Processus tue apres commit puis repris
        run: python scripts/check_runtime_recovery.py
      - name: Adaptateur DBOSAgent reel
        run: python scripts/check_runtime_workflow.py

  suite:
    name: Suite Django
    runs-on: ubuntu-latest
    # La suite prend 11 a 14 minutes sur un poste rapide; un runner a deux
    # coeurs est plus lent, et l installation des dependances compte aussi.
    timeout-minutes: 45

    env:
      # Aucun appel sortant depuis la CI. Les reglages coupent deja le juge
      # sous `manage.py test` (planner/settings.py, _EN_TEST); ces valeurs le
      # disent explicitement pour qui lit les logs du job.
      JEV_API_KEY: ""
      TYPESAFE_API_KEY: ""
      JUGEMENT_REPLI_LLM: "0"
      SECRET_KEY: "ci-not-a-secret"
      # PAS de DEBUG="0" ici: settings l.210 activerait SECURE_SSL_REDIRECT et
      # le client de test, qui emet du http, recevrait un 301 sur chaque
      # requete. La CI serait rouge sur un arbre propre, donc ignoree.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrations sans conflit ni oubli
        # Deux migrations concurrentes ont mis la production a 502 pendant
        # 11 h le 28 septembre: --check echoue si un modele a change sans sa
        # migration, ou si deux tetes coexistent.
        run: python manage.py makemigrations --check --dry-run

      - name: Suite unittest
        # Tout le depot, pas seulement core: services/scheduling a ses propres
        # tests, et c'est lui qui calcule les chevauchements qu'update_block
        # interroge.
        run: python manage.py test -v 1 --noinput

  pytest:
    name: Suite pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECRET_KEY: ci-not-a-secret
      JEV_API_KEY: ""
      TYPESAFE_API_KEY: ""
      JUGEMENT_REPLI_LLM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Suite pytest
        # Treize modules de core/ ecrivent leurs tests en FONCTIONS: la
        # decouverte unittest les importe sans les collecter, et le job
        # resterait vert en les ignorant.
        run: python -m pytest -q
